<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurações - Flow Translate</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        padding: 24px;
      }

      h1 {
        margin-bottom: 24px;
      }

      .setting-group {
        margin-bottom: 24px;
      }

      label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
      }

      input[type="color"] {
        margin-top: 10px;
        width: 80px;
        height: 40px;
        border: none;
        background: none;
        cursor: pointer;
      }

      #save-message {
        color: #22c55e;
        margin-top: 20px;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <h1>⚙️ Configurações</h1>

    <div class="setting-group">
      <label>
        <input type="checkbox" id="highlight-enabled" />
        Habilitar highlight automático
      </label>
    </div>

    <div class="setting-group">
      <label for="highlight-color"> Cor do highlight </label>

      <input type="color" id="highlight-color" value="#3b82f6" />
    </div>

    <div class="setting-group">
      <label>
        <input type="checkbox" id="tooltip-enabled" />
        Habilitar tooltip ao selecionar texto
      </label>
    </div>

    <p id="save-message"></p>

    <script src="settings.js"></script>
  </body>
</html>
