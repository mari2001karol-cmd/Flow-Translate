<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Meus Baralhos</title>

    <style>
      body {
        font-family: Arial, sans-serif;

        background: #0f172a;

        color: white;

        padding: 20px;

        min-width: 320px;
      }

      h1 {
        font-size: 24px;

        margin-bottom: 20px;

        text-align: center;
      }

      .deck {
        background: #1e293b;

        padding: 14px;

        border-radius: 12px;

        margin-bottom: 12px;

        box-shadow: 0 0 12px rgba(0, 0, 0, 0.25);
      }

      .deck-name {
        font-weight: bold;

        font-size: 18px;

        margin-bottom: 6px;
      }

      .deck-count {
        color: #94a3b8;

        font-size: 14px;

        margin-bottom: 12px;
      }

      .deck-actions {
        display: flex;

        flex-wrap: wrap;

        gap: 8px;
      }

      button {
        border: none;

        border-radius: 8px;

        padding: 10px 12px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;
      }

      button:hover {
        transform: translateY(-1px);
      }

      #create-deck-btn,
      #start-review-btn,
      #export-btn,
      #import-btn {
        width: 100%;

        margin-top: 10px;
      }

      #create-deck-btn {
        background: #2563eb;

        color: white;
      }

      #start-review-btn {
        background: #4f46e5;

        color: white;
      }

      #export-btn {
        background: #0ea5e9;

        color: white;
      }

      #import-btn {
        background: #14b8a6;

        color: white;
      }

      .rename-deck-btn {
        background: #3b82f6;

        color: white;
      }

      .reset-deck-btn {
        background: #f59e0b;

        color: white;
      }

      .delete-deck-btn {
        background: #ef4444;

        color: white;
      }

      #import-file {
        display: none;
      }

      /* MODAL */

      .modal-overlay {
        position: fixed;

        inset: 0;

        background: rgba(0, 0, 0, 0.6);

        display: none;

        justify-content: center;

        align-items: center;

        z-index: 999;
      }

      .modal {
        background: #1e293b;

        padding: 20px;

        border-radius: 14px;

        width: 90%;

        max-width: 320px;

        box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      }

      .modal h2 {
        margin-top: 0;

        margin-bottom: 14px;

        font-size: 20px;
      }

      .modal p {
        color: #cbd5e1;

        margin-bottom: 18px;
      }

      .modal input {
        width: 100%;

        padding: 10px;

        border-radius: 8px;

        border: none;

        margin-bottom: 18px;

        box-sizing: border-box;

        background: #0f172a;

        color: white;
      }

      .modal-buttons {
        display: flex;

        gap: 10px;

        justify-content: flex-end;
      }

      .cancel-btn {
        background: #475569;

        color: white;
      }

      .confirm-btn {
        background: #2563eb;

        color: white;
      }

      .danger-btn {
        background: #ef4444;

        color: white;
      }
    </style>
  </head>

  <body>
    <h1>📚 Meus Baralhos</h1>

    <div id="decks-container"></div>

    <button id="create-deck-btn">+ Novo Baralho</button>

    <button id="start-review-btn">▶️ Iniciar Revisão</button>

    <button id="export-btn">📤 Exportar Baralhos</button>

    <button id="import-btn">📥 Importar Baralhos</button>

    <input type="file" id="import-file" accept=".json" />

    <!-- MODAL -->

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <h2 id="modal-title"></h2>

        <p id="modal-message"></p>

        <input type="text" id="modal-input" />

        <div class="modal-buttons">
          <button class="cancel-btn" id="modal-cancel-btn">Cancelar</button>

          <button class="confirm-btn" id="modal-confirm-btn">Confirmar</button>
        </div>
      </div>
    </div>

    <script src="decks.js"></script>
  </body>
</html>
