<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisão de Flashcards</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 20px;
      min-width: 320px;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    .card-container {
  perspective: 1200px;
  margin-bottom: 35px;
}

.card {
  position: relative;
  width: 100%;
  max-width: 320px;
  height: 170px;
  margin: 0 auto;
  transform-style: preserve-3d;
  transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
}

.card.flipped {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 18px;
  backface-visibility: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
  text-align: center;

  overflow: hidden;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.45),
    0 0 25px rgba(236, 72, 153, 0.25);

  background: linear-gradient(
    135deg,
    #1e1b4b,
    #312e81,
    #4c1d95
  );
}

.card-front {
  border: 1px solid rgba(236, 72, 153, 0.35);
}

.card-back {
  transform: rotateY(180deg);

  background: linear-gradient(
    135deg,
    #4c1d95,
    #831843,
    #be185d
  );

  border: 1px solid rgba(244, 114, 182, 0.5);
}

    .word {
    font-size: 30px;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 12px rgba(236, 72, 153, 0.6);
   }

    .translation {
     font-size: 26px;
     color: #fbcfe8;
     font-weight: bold;
     text-shadow: 0 0 14px rgba(244, 114, 182, 0.7);
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>📚 Revisão</h1>

  <p id="review-progress">
  0 cards disponíveis
</p>

  <div class="card-container">

  <div class="card" id="flashcard">

    <div class="card-face card-front">
      <div id="word" class="word">
        Carregando...
      </div>
    </div>

    <div class="card-face card-back">
      <div id="translation" class="translation"></div>
    </div>

  </div>

</div>

<button id="show-answer-btn">
  Mostrar resposta
</button>

<div id="review-actions" style="display: none; margin-top: 20px;">

  <button id="hard-btn">
    😞 Difícil
  </button>

  <button id="medium-btn">
    🙂 Médio
  </button>

  <button id="easy-btn">
    😄 Fácil
  </button>

</div>

  <script src="review.js"></script>
</body>
</html>
